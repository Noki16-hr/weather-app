<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form id="my-form">
          <label for="city-input" class="visually-hidden">Enter a city</label>
          <input
            id="city-input"
            class="search"
            type="search"
            placeholder="Enter a city..."
            required
          />
          <input class="button" type="submit" value="Search" />
        </form>
      </header>

      <main>
        <section class="current-weather">
          <div>
            <h1 id="main-heading">Paris</h1>
            <p>
              <span id="date-time">Saturday 15:32</span>,
              <span id="condition">moderate rain</span><br />
              Humidity: <strong id="humidity">87%</strong>, Wind:
              <strong id="wind">7.2 km/h</strong>
            </p>
          </div>

          <div class="degrees">
            <div id="icon"></div>
            <span id="temperature" class="temperature">14</span>
            <span class="unit">°C</span>
          </div>
        </section>
        <div class="weather-forecast">
          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Tue</div>
            <div class="weather-forecast-icon">⛅️</div>
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature">
                <strong>15°</strong>
              </div>
              <div class="weather-forecast-temperature">9°</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Wed</div>
            <div class="weather-forecast-icon">☀️</div>
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature">
                <strong>18°</strong>
              </div>
              <div class="weather-forecast-temperature">10°</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Thu</div>
            <div class="weather-forecast-icon">🌧️</div>
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature">
                <strong>12°</strong>
              </div>
              <div class="weather-forecast-temperature">7°</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Fri</div>
            <div class="weather-forecast-icon">⛅️</div>
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature">
                <strong>16°</strong>
              </div>
              <div class="weather-forecast-temperature">8°</div>
            </div>
          </div>

          <div class="weather-forecast-day">
            <div class="weather-forecast-date">Sat</div>
            <div class="weather-forecast-icon">☀️</div>
            <div class="weather-forecast-temperatures">
              <div class="weather-forecast-temperature">
                <strong>20°</strong>
              </div>
              <div class="weather-forecast-temperature">11°</div>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <p>
          This project was coded by
          <a href="https://github.com/Noki16-hr" target="_blank"
            >Noelia Jiménez</a
          >
          and is
          <a href="https://github.com/Noki16-hr/weather-app" target="_blank"
            >open-sourced on GitHub</a
          >, and
          <a href="https://noki-meteo.netlify.app/" target="_blank"
            >hosted on Netlify</a
          >.
        </p>
      </footer>
    </div>
    <script src="index.js" defer></script>
  </body>
</html>
